# MediaMTX v1.17.1 configuration for 50 logical camera paths backed by two
# continuously-looped, packet-copy publishers.
logLevel: info
logDestinations: [stdout]
writeQueueSize: 1024

# Keep the current project's protocol surface while avoiding multicast sockets.
rtsp: true
rtspTransports: [udp, tcp]
rtmp: true
hls: true
hlsAlwaysRemux: false
webrtc: true
srt: true
api: false
metrics: false
pprof: false
playback: false

paths:
  source_01:
    source: publisher
    overridePublisher: false
  source_02:
    source: publisher
    overridePublisher: false
  cam_01:
    source: rtsp://127.0.0.1:8554/source_01
    sourceOnDemand: true
    sourceOnDemandStartTimeout: 25s
    sourceOnDemandCloseAfter: 10s
    rtspTransport: tcp
  cam_02:
    source: rtsp://127.0.0.1:8554/source_02
    sourceOnDemand: true
    sourceOnDemandStartTimeout: 25s
