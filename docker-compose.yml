name: camera-emulator

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 15s
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mediamtx:
    <<: *service-defaults
    image: bluenviron/mediamtx:1.17.1@sha256:9e39256d1ba35f0063700c6f62dd32e6db4592ddd9560d78f409ec451d79b1d8
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${CAMERA_ADVERTISE_IP:-192.168.0.55}"
    ports:
      - "${CAMERA_BIND_IP:-0.0.0.0}:8554:8554/tcp"
      - "${CAMERA_BIND_IP:-0.0.0.0}:1935:1935/tcp"
      - "${CAMERA_BIND_IP:-0.0.0.0}:8888:8888/tcp"
      - "${CAMERA_BIND_IP:-0.0.0.0}:8889:8889/tcp"
      - "${CAMERA_BIND_IP:-0.0.0.0}:8189:8189/udp"
      - "${CAMERA_BIND_IP:-0.0.0.0}:8890:8890/udp"
      - "${CAMERA_BIND_IP:-0.0.0.0}:8000:8000/udp"
      - "${CAMERA_BIND_IP:-0.0.0.0}:8001:8001/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  publisher-rpm-1:
    <<: *service-defaults
    image: lscr.io/linuxserver/ffmpeg:8.0.1@sha256:c72eaf699cb104e84c5292ee9b2a65bf3110738dec113d7cfcef02d7bc21b056
    depends_on:
      mediamtx:
        condition: service_started
    volumes:
      - ./assets:/assets:ro
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -nostdin
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /assets/RPM_1.mp4
      - -map
      - 0:v:0
      - -map
      - "0:a:0?"
      - "-c"
      - "copy"
      - -rtsp_transport
      - tcp
      - -f
      - rtsp
      - rtsp://mediamtx:8554/source_01

  publisher-rpm-2:
    <<: *service-defaults
    image: lscr.io/linuxserver/ffmpeg:8.0.1@sha256:c72eaf699cb104e84c5292ee9b2a65bf3110738dec113d7cfcef02d7bc21b056
    depends_on:
      mediamtx:
        condition: service_started
    volumes:
      - ./assets:/assets:ro
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -nostdin
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /assets/RPM_2.mp4
      - -map
      - 0:v:0
      - -map
      - "0:a:0?"
      - "-c"
      - "copy"
      - -rtsp_transport
      - tcp
      - -f
      - rtsp
      - rtsp://mediamtx:8554/source_02
